<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B4EE8">
<title>CreatiBox — Central</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --violeta:#5B4EE8; --violeta-osc:#4A3FD0; --violeta-claro:#ECEAFB;
  --amarillo:#FFE14D; --amarillo-osc:#F5C518;
  --tinta:#1A1B2E; --gris:#6B6B7B; --gris-claro:#9B9BAB;
  --linea:#EDEDF2; --fondo:#F7F7FB; --blanco:#FFFFFF;
  --verde:#22B573; --verde-claro:#E4F7EF; --rojo:#E5484D; --rojo-claro:#FCEBEC;
  --azul:#3B82F6; --naranja:#F59E0B; --naranja-claro:#FEF3E2;
  --radius:20px; --radius-sm:14px;
  --sombra:0 1px 3px rgba(26,27,46,.06),0 4px 16px rgba(26,27,46,.05);
  --sombra-lg:0 4px 24px rgba(91,78,232,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--fondo);color:var(--tinta);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;width:100%;padding:13px 15px;border:1.5px solid var(--linea);border-radius:var(--radius-sm);background:var(--blanco);color:var(--tinta);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violeta)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--gris);margin:14px 0 6px}
.oculto{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D8D8E0;border-radius:4px}

/* ===== Layout general ===== */
.app{display:flex;min-height:100vh}
/* Sidebar desktop */
.sidebar{width:240px;background:var(--blanco);border-right:1px solid var(--linea);padding:22px 14px;position:fixed;top:0;bottom:0;left:0;z-index:30;display:flex;flex-direction:column;gap:4px}
.sidebar .marca{display:flex;align-items:center;gap:10px;padding:6px 10px 20px}
.sidebar .marca .logo{width:38px;height:38px;border-radius:11px;background:var(--violeta);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
.sidebar .marca .txt{font-weight:800;font-size:1.15rem}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);font-size:.92rem;font-weight:600;color:var(--gris);text-align:left;width:100%;transition:all .15s}
.nav-item .ic{width:22px;text-align:center;font-size:1.1rem;flex-shrink:0}
.nav-item:hover{background:var(--fondo)}
.nav-item.activo{background:var(--violeta);color:#fff}
.sidebar .abajo{margin-top:auto;padding-top:12px;border-top:1px solid var(--linea)}

/* Main */
.main{flex:1;margin-left:240px;padding:26px 30px 40px;max-width:1180px;min-width:0}
.matriz-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.matriz-scroll table{min-width:560px}
.topbar-desk{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.topbar-desk h1{font-size:1.55rem;font-weight:800}
.topbar-desk .sub{color:var(--gris);font-size:.88rem;margin-top:2px;font-weight:500}

/* Bottom nav (móvil) */
.botnav{display:none}

/* ===== Tarjetas base ===== */
.card{background:var(--blanco);border-radius:var(--radius);padding:22px;box-shadow:var(--sombra)}
.chart-box{position:relative;height:200px;width:100%}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

/* KPI cards */
.kpi{background:var(--blanco);border-radius:var(--radius);padding:20px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.kpi .ic-box{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;margin-bottom:14px}
.kpi .label{font-size:.82rem;color:var(--gris);font-weight:600}
.kpi .valor{font-size:1.7rem;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.kpi .delta{font-size:.78rem;font-weight:600;margin-top:6px}
.kpi .delta.up{color:var(--verde)} .kpi .delta.down{color:var(--rojo)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:var(--radius-sm);font-weight:700;font-size:.95rem;transition:transform .1s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--violeta);color:#fff}
.btn-primary:hover{box-shadow:var(--sombra-lg)}
.btn-amarillo{background:var(--amarillo);color:var(--tinta)}
.btn-ghost{background:var(--fondo);color:var(--tinta)}
.btn-verde{background:var(--verde);color:#fff}
.btn-wa{background:#25D366;color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--linea);color:var(--tinta)}
.btn-peligro{background:transparent;color:var(--rojo);font-weight:600}
.btn-sm{padding:9px 14px;font-size:.85rem;border-radius:10px}
.btn-block{width:100%}

/* Chips / pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:.72rem;font-weight:700}
.pill.verde{background:var(--verde-claro);color:var(--verde)}
.pill.rojo{background:var(--rojo-claro);color:var(--rojo)}
.pill.naranja{background:var(--naranja-claro);color:var(--naranja)}
.pill.violeta{background:var(--violeta-claro);color:var(--violeta)}

/* Tabla */
.tabla{width:100%;border-collapse:collapse}
.tabla th{text-align:left;font-size:.75rem;color:var(--gris-claro);font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--linea)}
.tabla td{padding:13px 12px;border-bottom:1px solid var(--linea);font-size:.9rem;font-weight:500}
.tabla tr:last-child td{border-bottom:none}
.tabla tr.click{cursor:pointer}
.tabla tr.click:hover td{background:var(--fondo)}

/* Sección título */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sec-head h2{font-size:1.15rem;font-weight:700}
.sec-head .link{color:var(--violeta);font-weight:600;font-size:.85rem}

/* FAB */
.fab{position:fixed;bottom:24px;right:24px;z-index:40;background:var(--violeta);color:#fff;border-radius:16px;padding:16px 22px;font-weight:700;box-shadow:var(--sombra-lg);display:flex;align-items:center;gap:8px}

/* Modal / hoja */
.modal{position:fixed;inset:0;z-index:60;background:rgba(26,27,46,.5);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.abierto{opacity:1;pointer-events:auto}
.modal-panel{background:var(--blanco);border-radius:var(--radius);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:26px;transform:scale(.96);transition:transform .2s}
.modal.abierto .modal-panel{transform:scale(1)}
.modal-panel h2{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.modal-panel .msub{color:var(--gris);font-size:.85rem;margin-bottom:16px}
.modal-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:10px;background:var(--fondo);font-size:1.1rem;display:flex;align-items:center;justify-content:center}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:#fff;padding:13px 24px;border-radius:999px;font-size:.88rem;font-weight:600;opacity:0;transition:all .25s;z-index:80;pointer-events:none}
.toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}

/* Cargando / login */
.cargando{position:fixed;inset:0;z-index:90;background:var(--fondo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spin{width:44px;height:44px;border:4px solid var(--violeta-claro);border-top-color:var(--violeta);border-radius:50%;animation:girar 1s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.login{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,var(--violeta),var(--violeta-osc));display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:var(--blanco);border-radius:24px;padding:34px 28px;width:100%;max-width:390px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-box .logo{width:56px;height:56px;border-radius:16px;background:var(--violeta);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem;margin:0 auto 14px}
.login-box h1{text-align:center;font-size:1.4rem;font-weight:800}
.login-box .sub{text-align:center;color:var(--gris);font-size:.85rem;margin-bottom:8px}
.login-err{color:var(--rojo);font-size:.82rem;text-align:center;margin-top:10px;min-height:1em}

/* Steps cotizador */
.stepper{display:flex;align-items:center;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.step-dot{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--gris-claro)}
.step-dot .n{width:24px;height:24px;border-radius:50%;background:var(--linea);color:var(--gris);display:flex;align-items:center;justify-content:center;font-size:.75rem}
.step-dot.activo .n{background:var(--violeta);color:#fff}
.step-dot.hecho .n{background:var(--verde);color:#fff}
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.opt-card{border:2px solid var(--linea);border-radius:var(--radius-sm);padding:18px 16px;text-align:center;font-weight:700;font-size:.95rem;transition:all .15s;background:var(--blanco)}
.opt-card:hover{border-color:var(--violeta-claro)}
.opt-card.sel{border-color:var(--violeta);background:var(--violeta-claro)}
.opt-card .emoji{font-size:1.7rem;display:block;margin-bottom:8px}
.opt-card .desc{font-size:.75rem;color:var(--gris);font-weight:500;margin-top:4px}

/* Resumen cotización */
.quote-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--linea);font-size:.92rem}
.quote-line.total{border-bottom:none;border-top:2px solid var(--tinta);margin-top:6px;padding-top:14px;font-weight:800;font-size:1.15rem}
.badge-desc{background:var(--verde-claro);color:var(--verde);font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px}

/* progress bar (abonos) */
.progress{height:8px;border-radius:999px;background:var(--linea);overflow:hidden;margin:8px 0}
.progress .fill{height:100%;background:var(--verde);border-radius:999px;transition:width .3s}

/* Responsivo */
@media(max-width:860px){
  .sidebar{display:none}
  .main{margin-left:0;padding:16px 16px 90px;max-width:100%}
  .topbar-desk h1{font-size:1.3rem}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--blanco);border-top:1px solid var(--linea);padding:8px 4px 10px;justify-content:space-around}
  .botnav .b{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem;font-weight:600;color:var(--gris-claro);padding:4px 8px;flex:1}
  .botnav .b .ic{font-size:1.25rem}
  .botnav .b.activo{color:var(--violeta)}
  .fab{bottom:78px;right:16px}
  .tabla-wrap{overflow-x:visible}
  .tabla.responsive thead{display:none}
  .tabla.responsive, .tabla.responsive tbody, .tabla.responsive tr{display:block;width:100%}
  .tabla.responsive tr{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:6px 12px;margin-bottom:10px}
  .tabla.responsive td{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--linea);text-align:right}
  .tabla.responsive td:last-child{border-bottom:none}
  .tabla.responsive td::before{content:attr(data-label);font-size:.72rem;font-weight:700;color:var(--gris-claro);text-transform:uppercase;letter-spacing:.03em;text-align:left;flex-shrink:0}
  .tabla.responsive td[data-label=""]::before, .tabla.responsive td:not([data-label])::before{content:""}
  .tabla.responsive td.td-full{display:block;text-align:left}
  .tabla.responsive td.td-full::before{display:none}
  /* Acordeón móvil: solo fila compacta visible, resto oculto hasta expandir */
  .tabla.acordeon tr{padding:0;overflow:hidden}
  .tabla.acordeon tr td{display:none}
  .tabla.acordeon tr td.acc-head{display:flex;padding:14px;align-items:center;gap:10px;justify-content:space-between;text-align:left;border-bottom:none;cursor:pointer}
  .tabla.acordeon tr td.acc-head::before{display:none}
  .tabla.acordeon tr td.acc-head .cabecera-datos{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
  .tabla.acordeon tr td.acc-head .cabecera-datos .folio-cliente{flex:1;min-width:0}
  .tabla.acordeon tr td.acc-head .cabecera-datos .metrica{text-align:right;flex-shrink:0}
  .tabla.acordeon tr td.acc-head .cabecera-datos .metrica .lbl{font-size:.65rem;font-weight:700;color:var(--gris-claro);text-transform:uppercase;letter-spacing:.03em}
  .tabla.acordeon tr td.acc-head .cabecera-datos .metrica .val{font-size:.95rem;font-weight:700}
  .tabla.acordeon tr td.acc-head .caret{color:var(--gris-claro);font-size:.9rem;transition:transform .2s;flex-shrink:0}
  .tabla.acordeon tr.expandida{background:var(--fondo)}
  .tabla.acordeon tr.expandida td{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px dashed var(--linea);text-align:right;font-size:.85rem}
  .tabla.acordeon tr.expandida td::before{content:attr(data-label);font-size:.7rem;font-weight:700;color:var(--gris-claro);text-transform:uppercase;letter-spacing:.03em;text-align:left;flex-shrink:0}
  .tabla.acordeon tr.expandida td.acc-head{background:var(--blanco);border-bottom:1px solid var(--linea)}
  .tabla.acordeon tr.expandida td.acc-head .caret{transform:rotate(90deg)}
  .tabla.acordeon tr.expandida td:last-child{border-bottom:none}
  .modal{align-items:flex-end;padding:0}
  .modal-panel{max-width:100%;border-radius:24px 24px 0 0;max-height:92vh}
}
/* Desktop: ocultar celdas específicas del acordeón, mostrar tabla normal */
@media(min-width:861px){
  .tabla.acordeon td.acc-head{display:none}
  .tabla.acordeon td.td-full{display:none}
}
</style>
</head>

<!-- Login -->

<!-- APP -->

</div>

<!-- Bottom nav (móvil) -->

  <button class="b" id="btnMas"><span class="ic">☰</span>Más</button>
</nav>

<!-- Modal genérico -->
<div class="modal" id="modal"><div class="modal-panel" id="modalPanel"></div></div>

function capitalActual(){
  let cap = config.capitalInicial||0;
  const movs = [...ventas.map(v=>({f:v.fecha,m:pagosDe(v)})), ...gastos.map(g=>({f:g.fecha,m:-g.monto}))];
  movs.forEach(x=> cap += x.m);

}

/* ---- CÁLCULO DE COTIZACIÓN ---- */
function calcularCoti(){
  const o=coti.opciones, c=coti.cant||1;
  let base=null, etiqueta="", desc=0, descTipo="", extras=[], notas=[];
  if(coti.servicio==="estampado"){
    if(!o.tecnica||!o.prenda) return null;
    base = P(o.tecnica,o.prenda);
    etiqueta = `${o.prenda} — ${o.tecnica==='estampado_multicolor'?'Multicolor':'1 Color'}`;
    var _c={grupo:o.tecnica,item:o.prenda};
    if(o.numEst==='2'){ base += 32; extras.push(["2do estampado (+material)",32]); }
    desc = descMayoreoPrenda(c);
    if(PRECIOS.mayoreoExcluido.includes(o.prenda)) desc=0;
  } else if(coti.servicio==="bordado"){
    if(!o.prenda||!o.tipo) return null;
    base = P("bordado",o.prenda);
    etiqueta = `${o.prenda} — Bordado ${o.tipo==='nombre'?'Nombre/Texto':'Logo/Escudo'}`;
    var _c={grupo:"bordado",item:o.prenda};
    if(PRECIOS.mayoreoExcluido.includes(o.prenda)){
      desc=0; notas.push("Este precio ya incluye su propio escalón de cantidad — no se le suma descuento adicional");
    } else {
      desc = descMayoreoPrenda(c);
      const max = PRECIOS.mayoreoMax[o.prenda]; if(max && desc>max) desc=max;
    }
    if(o.tipo==='logo' && coti.extras.extra==='si'){ base += PRECIOS.bordadoExtra; extras.push(["Bordado extra (>10×10cm)",PRECIOS.bordadoExtra]); }
  } else if(coti.servicio==="sticker"){
    if(o.modo==='plantilla'){ if(!o.material) return null; base=P('sticker_plantilla',o.material); etiqueta=`Plantilla — ${o.material}`; notas.push("Mínimo 2 plantillas"); var _c={grupo:'sticker_plantilla',item:o.material}; }
    else if(o.modo==='paquete'){ if(!o.paquete||!o.material) return null; base=P(o.paquete,o.material); etiqueta=`Paquete ${o.paquete==='paquete_basico'?'Básico':'Escolar'} — ${o.material}`; var _c={grupo:o.paquete,item:o.material}; }
    else return null;
  } else if(coti.servicio==="calcomania"){
    if(!o.ancho||!o.alto) return null;
    const meds=PRECIOS.calcomania.medidas; const ia=meds.indexOf(+o.ancho), ib=meds.indexOf(+o.alto);
    base = PRECIOS.calcomania.precios[ib][ia];
    etiqueta = `Calcomanía ${o.ancho}×${o.alto} cm`;
    desc = descMayoreoCalco(c);
    notas.push("Compra mínima $50");
  } else if(coti.servicio==="otros"){
    if(!o.producto) return null; base=P("otros",o.producto); etiqueta=o.producto; var _c={grupo:'otros',item:o.producto};
  } else if(coti.servicio==="personalizado"){
    if(!o.productoId) return null;
    const pc=productosCustom.find(x=>x.id===o.productoId); if(!pc) return null;
    base=pc.precioVenta; etiqueta=pc.nombre; var _c={custom:true,producto:pc};
    if(pc.notas) notas.push(pc.notas);
  }
  if(base==null) return null;
  const subtotal = base*c;
  const montoDesc = subtotal*(desc/100);
  let totalItems = subtotal - montoDesc;
  // extras únicos (ponchado: una sola vez, no por pieza)
  let extrasUnicos = 0;
  if(coti.servicio==="bordado" && coti.extras.ponchado==='si'){ extrasUnicos += PRECIOS.ponchado; extras.push(["Ponchado (único por diseño)",PRECIOS.ponchado]); }
  const total = totalItems + extrasUnicos;
  return {etiqueta, base, cant:c, subtotal, desc, montoDesc, extras, total, notas, _costeo: (typeof _c!=="undefined")?_c:null};
}

function renderResultadoCoti(r){
  // "¿Cómo se arma?" (interno)
  let armado="";
  if(r._costeo && r._costeo.custom){
    const pc=r._costeo.producto;
    const desglose=(pc.materiales||[]).map(m=>[`${m.nombre} (${m.cantidad}×${fmt2(m.costoUnitario)})`, m.cantidad*m.costoUnitario]);
    if(pc.manoObra) desglose.push(["Mano de obra",pc.manoObra]);

let carrito = []; // [{etiqueta, cant, base, desc, montoDesc, extras, total, notas, _costeo}]

window.__agregarAlCarrito=()=>{

  carrito.push(JSON.parse(JSON.stringify(r)));

window.__eliminarDelCarrito=(i)=>{ carrito.splice(i,1); renderCotizar(); };

window.__ajustarMayoreoItem=(i,pct)=>{
  const item=carrito[i]; const p=+pct;
  // recalcular con nuevo descuento (encima del base×cant, sin re-derivar del servicio)
  item.desc=p;
  item.montoDesc=item.subtotal*p/100;
  // sumar extras únicos que ya venían (ponchado)
  const extrasUnicos=item.extras.reduce((s,e)=>s+e[1],0) - (item.extras.filter(e=>!e[0].includes("único")).reduce((s,e)=>s+e[1],0));
  // Simpler: total = subtotal - montoDesc + suma de extras "únicos" (los que suman una sola vez, no por pza)
  // El motor original ya sumó los "por pieza" dentro de base. Los "únicos" son ponchado y bordado extra por unidad? En nuestro caso extras solo incluye "únicos" (ponchado) + "por pieza que ya está sumado al base" (extra bordado suma al base). Así que solo el ponchado va aquí.
  const soloUnicos=item.extras.filter(e=>e[0].toLowerCase().includes("único")).reduce((s,e)=>s+e[1],0);
  item.total = item.subtotal - item.montoDesc + soloUnicos;
  renderCotizar();
};

/* Tiempo transcurrido desde el inicio de producción (o fecha del pedido si no existe inicioProd).
   Verde 0-24h · Naranja 24-48h · Rojo 48h+. Si el pedido está completado, congela con horasProduccion. */
function tiempoTranscurrido(v){
  const completado=(v.estadoProd||"activo")==="completado";
  let horas;
  if(completado && v.horasProduccion!=null){
    horas = v.horasProduccion;
  } else {
    const inicioStr = v.inicioProd || v.fecha; // fallback a fecha si es un pedido viejo sin inicioProd
    if(!inicioStr) return {texto:"—", color:"var(--gris)"};
    // Si tiene formato ISO con hora, úsala; si solo es fecha, arranca a las 00:00
    const inicio = new Date(inicioStr.length>10 ? inicioStr : inicioStr+"T00:00:00");
    horas = (Date.now()-inicio.getTime())/3600000;
    if(horas<0) horas=0;
  }
  let color, texto;
  if(horas<24) color="var(--verde)";
  else if(horas<48) color="var(--naranja)";
  else color="var(--rojo)";
  if(horas<1) texto=`${Math.floor(horas*60)}m`;
  else if(horas<24) texto=`${Math.floor(horas)}h`;
  else texto=`${Math.floor(horas/24)}d ${Math.floor(horas%24)}h`;
  if(completado) texto = "✓ "+texto;
  return {texto, color};
}

window.__marcarCompletado=async(id)=>{

  const v=ventas.find(x=>x.id===id);
  // Congelar el tiempo transcurrido al momento de completarse
  let horas=null;
  const inicioStr=v?.inicioProd || v?.fecha;
  if(inicioStr){
    const inicio=new Date(inicioStr.length>10 ? inicioStr : inicioStr+"T00:00:00");
    horas=(Date.now()-inicio.getTime())/3600000;
    if(horas<0) horas=0;
  }
  await updateDoc(doc(db,"ventas",id),{estadoProd:"completado",fechaCompletado:hoy(),horasProduccion:horas});
  toast("Pedido completado ✓");
};

window.__guardarPedido=async()=>{
  const total=parseFloat($("pTotal").value)||0;
  const cliente=$("pCliente").value.trim();
  if(!cliente){ toast("Ponle nombre al cliente"); return; }
  const pagos=[]; const ab=parseFloat($("pAbono").value);
  if(ab>0) pagos.push({monto:ab,metodo:$("pMetodo").value,fecha:$("pFecha").value});
  let items=[]; try{ items=JSON.parse($("pItems").value); }catch(e){}
  const datos={folio:$("pFolio").value.trim(),fecha:$("pFecha").value,cliente,
    productos:$("pProd").value.trim(),detalles:$("pDet").value.trim(),total,
    referido:$("pRef").value.trim()||null,pagos,items,estadoProd:"activo",inicioProd:new Date().toISOString()};
  await addDoc(collection(db,"ventas"),datos);
  carrito=[]; cerrarModal(); toast("Pedido guardado ✓");
};

window.__verPedido=(id)=>{
  const v=ventas.find(x=>x.id===id); if(!v) return;
  const pag=pagosDe(v), falta=faltanteDe(v), pct=v.total?Math.min(100,pag/v.total*100):0;
  const completado=(v.estadoProd||"activo")==="completado";
  const pagosHtml=(v.pagos||[]).length?v.pagos.map((p,i)=>`<div class="quote-line"><span>${fmtFecha(p.fecha)} · ${p.metodo}</span><span>${fmt(p.monto)} <button onclick="__borrarAbono('${id}',${i})" style="color:var(--rojo);margin-left:8px">✕</button></span></div>`).join(""):'<div style="color:var(--gris);font-size:.85rem;padding:6px 0">Sin abonos aún</div>';
  const itemsHtml=(v.items||[]).length?`<div style="background:var(--fondo);border-radius:12px;padding:12px;margin:8px 0"><div style="font-weight:700;font-size:.85rem;margin-bottom:6px">Productos del pedido</div>${v.items.map(it=>`<div style="font-size:.85rem;padding:4px 0;display:flex;justify-content:space-between"><span>${it.cant}× ${it.etiqueta}</span><span><b>${fmt(it.total)}</b></span></div>`).join('')}</div>`:'';
  abrirModal(`<button class="modal-close" onclick="__cerrar()">✕</button>
    <h2>${v.folio||'Pedido'}</h2><div class="msub">${v.cliente} · ${fmtFecha(v.fecha)}</div>
    <div style="display:flex;gap:8px;margin:8px 0 14px">
      ${completado?'<span class="pill verde">✓ Terminado</span>':'<span class="pill naranja">En producción</span>'}
      ${falta>0.01?`<span class="pill naranja">Falta ${fmt(falta)}</span>`:`<span class="pill verde">Saldado</span>`}
    </div>
    ${itemsHtml}
    ${v.productos?`<div style="background:var(--fondo);border-radius:14px;padding:12px;margin:8px 0"><div style="font-weight:600">${v.productos}</div>${v.detalles?`<div style="font-size:.82rem;color:var(--gris);margin-top:6px">${v.detalles}</div>`:''}${v.referido?`<div style="font-size:.78rem;margin-top:8px"><span class="pill violeta">Referido: ${v.referido}</span></div>`:''}</div>`:''}
    <div class="quote-line"><span>Total</span><span><b>${fmt(v.total)}</b></span></div>
    <div class="quote-line"><span>Pagado</span><span style="color:var(--verde)">${fmt(pag)}</span></div>
    <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
    <div class="quote-line"><span>Falta</span><span style="color:${falta>0.01?'var(--naranja)':'var(--verde)'}"><b>${fmt(falta)}</b></span></div>
    <div style="margin-top:16px"><div style="font-weight:700;margin-bottom:6px">Abonos</div>${pagosHtml}</div>
    ${falta>0.01?`<div style="background:var(--verde-claro);border-radius:14px;padding:14px;margin-top:14px">
      <label style="margin-top:0">Registrar nuevo abono</label>
      <div class="grid g2"><input type="number" id="nvAbono" placeholder="Monto ($)"><select id="nvMetodo"><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option></select></div>
      <label style="margin-top:10px">Fecha del abono</label><input type="date" id="nvFecha" value="${hoy()}">
      <button class="btn btn-verde btn-block" style="margin-top:10px" onclick="__agregarAbono('${id}')">＋ Agregar abono</button></div>`:'<div class="pill verde" style="margin-top:14px">✓ Pedido saldado completamente</div>'}
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
      ${!completado?`<button class="btn btn-verde" style="flex:1;min-width:120px" onclick="__marcarCompletado('${id}');__cerrar()">✓ Marcar terminado</button>`:''}
      <button class="btn btn-outline" style="flex:1;min-width:100px" onclick="__editarPedido('${id}')">Editar</button>
      <button class="btn btn-peligro" onclick="__borrarPedido('${id}')">Eliminar</button></div>`);
};
window.__agregarAbono=async(id)=>{
  const v=ventas.find(x=>x.id===id); const m=parseFloat($("nvAbono").value);
  if(!m||m<=0){ toast("Ingresa un monto válido"); return; }
  const pagos=[...(v.pagos||[]),{monto:m,metodo:$("nvMetodo").value,fecha:$("nvFecha").value||hoy()}];
  await updateDoc(doc(db,"ventas",id),{pagos}); toast("Abono registrado 💵"); __verPedido(id);
};
window.__borrarAbono=async(id,i)=>{
  const v=ventas.find(x=>x.id===id); const pagos=[...(v.pagos||[])]; pagos.splice(i,1);
  await updateDoc(doc(db,"ventas",id),{pagos}); __verPedido(id);
};
window.__borrarPedido=async(id)=>{ if(confirm("¿Eliminar este pedido?")){ await deleteDoc(doc(db,"ventas",id)); cerrarModal(); toast("Pedido eliminado"); } };
window.__editarPedido=(id)=>{ const v=ventas.find(x=>x.id===id);

/* Acordeón: en móvil, tocar la fila la expande/contrae. En desktop, abre el detalle. */
window.__togglePedido=(tr,id)=>{
  if(window.innerWidth>860){ __verPedido(id); return; }
  document.querySelectorAll(".tabla.acordeon tr.expandida").forEach(r=>{ if(r!==tr) r.classList.remove("expandida"); });
  tr.classList.toggle("expandida");
};
window.__toggleGasto=(tr,id)=>{
  if(window.innerWidth>860){ __editarGasto(id); return; }
  document.querySelectorAll(".tabla.acordeon tr.expandida").forEach(r=>{ if(r!==tr) r.classList.remove("expandida"); });
  tr.classList.toggle("expandida");
};

const CAT_GASTO = ["Material","Herramienta/Equipo","Prendas base","Diseños/Licencias","Envíos","Publicidad","Otro"];
function gastosMes(d){ const m=d.getMonth(),y=d.getFullYear(); return gastos.filter(g=>{if(!g.fecha)return false;const x=new Date(g.fecha+"T00:00:00");return x.getMonth()===m&&x.getFullYear()===y;}).reduce((s,g)=>s+(+g.monto||0),0); }
let gastoItems=[]; // buffer temporal para nuevo gasto multi-item

window.__nuevoGasto=()=>{
  gastoItems=[];

};

function modalGastoHTML(folio){
  const total=gastoItems.reduce((s,x)=>s+(+x.monto||0),0);

      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--linea)">

        <div class="grid g2"><div><label style="margin-top:0">Categoría</label><select id="gItemCat">${CAT_GASTO.map(c=>`<option>${c}</option>`).join("")}</select></div><div><label style="margin-top:0">Monto ($)</label><input type="number" id="gItemMonto" placeholder="0"></div></div>
        <button class="btn btn-ghost btn-sm btn-block" style="margin-top:10px" onclick="__agregarItemGasto()">＋ Agregar item</button>

window.__agregarItemGasto=()=>{
  const c=$("gItemConcepto").value.trim(); const m=parseFloat($("gItemMonto").value)||0;
  if(!c){ toast("Escribe el concepto"); return; }
  if(m<=0){ toast("Ingresa un monto"); return; }
  gastoItems.push({concepto:c,categoria:$("gItemCat").value,monto:m});
  const folio=$("gFolio").value;
  $("modalPanel").innerHTML=modalGastoHTML(folio);
};
window.__quitarItemGasto=(i)=>{
  gastoItems.splice(i,1);
  $("modalPanel").innerHTML=modalGastoHTML($("gFolio")?.value||"G-000");
};

window.__guardarGasto=async()=>{
  // Guardar cada item como un doc de gasto separado (mantiene compatibilidad con vista existente),
  // agrupados por el mismo folio para que "juntos" en la exportación.
  // Si solo hay 1 item o ninguno pero hay uno pendiente en el form, tomarlo también.
  const folio=$("gFolio").value.trim(); const fecha=$("gFecha").value; const metodo=$("gMetodo").value;
  // Auto-recoger un item semi-lleno
  const cPend=$("gItemConcepto")?.value.trim(), mPend=parseFloat($("gItemMonto")?.value)||0;
  if(cPend && mPend>0) gastoItems.push({concepto:cPend,categoria:$("gItemCat").value,monto:mPend});
  if(!gastoItems.length){ toast("Agrega al menos un item"); return; }
  const batch=writeBatch(db);
  gastoItems.forEach((it,i)=>{
    batch.set(doc(collection(db,"gastos")),{folio:gastoItems.length>1?`${folio}-${i+1}`:folio,fecha,concepto:it.concepto,categoria:it.categoria,metodo,monto:it.monto,grupo:gastoItems.length>1?folio:null});
  });
  await batch.commit();
  gastoItems=[]; cerrarModal(); toast(`Gasto registrado (${gastoItems.length||1} item${(gastoItems.length||1)>1?'s':''}) 📉`);
};

window.__borrarGasto=async(id)=>{ if(confirm("¿Eliminar este gasto?")){ await deleteDoc(doc(db,"gastos",id)); toast("Gasto eliminado"); } };

window.__editarGasto=(id)=>{
  const g=gastos.find(x=>x.id===id); if(!g) return;
  abrirModal(`<button class="modal-close" onclick="__cerrar()">✕</button><h2>Editar gasto</h2><div class="msub">Corrige cualquier dato del gasto</div>
    <label>Folio</label><input id="egFolio" value="${(g.folio||'').replace(/"/g,'&quot;')}">
    <label>Fecha</label><input type="date" id="egFecha" value="${g.fecha||hoy()}">
    <label>Concepto</label><input id="egConcepto" value="${(g.concepto||'').replace(/"/g,'&quot;')}">
    <label>Categoría</label><select id="egCat">${CAT_GASTO.map(c=>`<option ${g.categoria===c?'selected':''}>${c}</option>`).join("")}</select>
    <label>Método de pago</label><select id="egMetodo">${["Transferencia","Efectivo","Tarjeta"].map(m=>`<option ${g.metodo===m?'selected':''}>${m}</option>`).join("")}</select>
    <label>Monto ($)</label><input type="number" id="egMonto" value="${g.monto||0}">
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn btn-primary" style="flex:1" onclick="__guardarEdicionGasto('${id}')">Guardar cambios</button>
      <button class="btn btn-peligro" onclick="__borrarGastoDesdeEdicion('${id}')">Eliminar</button>
    </div>`);
};
window.__guardarEdicionGasto=async(id)=>{
  const monto=parseFloat($("egMonto").value)||0;
  const concepto=$("egConcepto").value.trim();
  if(!concepto){ toast("Escribe el concepto"); return; }
  if(monto<=0){ toast("El monto debe ser mayor a 0"); return; }
  await updateDoc(doc(db,"gastos",id),{
    folio:$("egFolio").value.trim(), fecha:$("egFecha").value, concepto,
    categoria:$("egCat").value, metodo:$("egMetodo").value, monto
  });
  cerrarModal(); toast("Gasto actualizado ✓");
};
window.__borrarGastoDesdeEdicion=async(id)=>{
  if(!confirm("¿Eliminar este gasto? Esta acción no se puede deshacer.")) return;
  await deleteDoc(doc(db,"gastos",id));
  cerrarModal(); toast("Gasto eliminado");
};

window.__importarExcel=(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async(ev)=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"binary"});
      const ws=wb.Sheets["Resumen General"]; if(!ws){toast("No encontré la hoja 'Resumen General'");return;}
      const rows=XLSX.utils.sheet_to_json(ws,{header:1});
      // Recorremos por secciones marcadas con emojis; mapeamos nombre->precio competitivo (última col numérica útil)
      const ov=JSON.parse(JSON.stringify(preciosOverride));
      let grupo=null, cambios=0;
      const mapCol={ // en cada sección, ¿en qué índice está el precio competitivo?
        estampado_multicolor:3, estampado_unicolor:3, bordado:3
      };
      const alias={"Playera Prime Adulto":"Playera Prime Adulto","Playera Niño":"Playera Niño","Deportiva 100% Polyester":"Deportiva 100% Poliéster"};
      for(const r of rows){
        const c0=(r[0]||"").toString();
        if(c0.includes("IMPRESION MULTICOLOR")){grupo="estampado_multicolor";continue;}
        if(c0.includes("VINIL TEXTIL 1 COLOR")){grupo="estampado_unicolor";continue;}
        if(c0.includes("BORDADO")&&!c0.includes("de escudo")){grupo="bordado";continue;}
        if(c0.includes("STICKERS")||c0.includes("CALCOMAN")||c0.includes("OTROS")||c0.includes("LIBRETAS")){grupo=null;continue;}
        if(!grupo) continue;
        const col=mapCol[grupo]; const precio=r[col];
        if(typeof precio==="number" && c0 && PRECIOS[grupo]){
          const key=alias[c0]||c0;
          if(PRECIOS[grupo][key]!=null){ ov[grupo]={...(ov[grupo]||{})}; ov[grupo][key]=precio; cambios++; }
        }
      }
      if(!cambios){toast("No encontré precios para actualizar (revisa el formato)");return;}
      await setDoc(doc(db,"config","precios"),ov);
      toast(`${cambios} precios importados ✨`);
    }catch(err){ console.error(err); toast("Error leyendo el Excel"); }
  };
  reader.readAsBinaryString(file);
};

  return `<div class="kpi"><div class="ic-box" style="background:${bg};color:${color}">${ic}</div><div class="label">${label}</div><div class="valor">${valor}</div></div>`;

function mismoMes(fecha,d){ if(!fecha)return false; const x=new Date(fecha+"T00:00:00"); return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear(); }

function ingresosPorMes(nMeses){
  const res=[]; const base=new Date();
  for(let i=nMeses-1;i>=0;i--){
    const d=new Date(base.getFullYear(),base.getMonth()-i,1);
    const label=d.toLocaleDateString("es-MX",{month:"short"});
    const val=ventas.reduce((s,v)=>s+(v.pagos||[]).filter(p=>mismoMes(p.fecha,d)).reduce((a,p)=>a+(+p.monto||0),0),0);
    res.push({label,val});
  }
  return res;
}

  const data=ingresosPorMes(6);

}
function dibujarIngGas(cid){
  const el=$(cid); if(!el||!window.Chart)return; if(charts[cid])charts[cid].destroy();
  const ahora=new Date();
  const ing=ventas.reduce((s,v)=>s+(v.pagos||[]).filter(p=>mismoMes(p.fecha,ahora)).reduce((a,p)=>a+(+p.monto||0),0),0);
  const gas=gastosMes(ahora);
  charts[cid]=new Chart(el,{type:"bar",data:{labels:["Ingresos","Gastos"],datasets:[{data:[ing,gas],backgroundColor:["#22B573","#E5484D"],borderRadius:10,barThickness:60}]},options:chartOpts(true)});
}
function chartOpts(noGrid){
  return {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.y)}}},scales:{y:{beginAtZero:true,grid:{color:"#EDEDF2"},ticks:{callback:v=>"$"+v.toLocaleString("es-MX")}},x:{grid:{display:false}}}};
}

/* =====================================================================
   IMPORTAR desde Excel — Ventas, Pedidos y Gastos
   Espera el formato de tu "Registro_de_Ventas_e_Ingresos.xlsx":
   hoja "Registro de Ventas e Ingresos" (Gasto + abonos de Venta) y
   hoja "Pedidos" (folio -> cliente/productos/total/detalles).
   ===================================================================== */
function catInferida(concepto){
  const c=(concepto||"").toLowerCase();
  if(/cricut|prensa|impresora|brother|maker|equipo|maquina/.test(c)) return "Herramienta/Equipo";
  if(/amazon|mercado libre|material|tela|vinil|hilo/.test(c)) return "Material";
  if(/etsy|diseñ|disenio|licencia/.test(c)) return "Diseños/Licencias";
  if(/envio|paqueter|dhl|fedex/.test(c)) return "Envíos";
  if(/publicidad|ads|marketing/.test(c)) return "Publicidad";
  return "Otro";
}
function fechaCelda(v){
  if(v==null) return hoy();
  if(v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;
  if(typeof v==="number"){ const d=XLSX.SSF.parse_date_code(v); return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`; }
  return String(v);
}

window.__importarVentasGastosExcel=(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async(ev)=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"binary",cellDates:true});
      const wsReg=wb.Sheets["Registro de Ventas e Ingresos"];
      const wsPed=wb.Sheets["Pedidos"];
      if(!wsReg && !wsPed){ toast("No encontré las hojas 'Registro de Ventas e Ingresos' o 'Pedidos'"); return; }

      let nuevosGastos=0, nuevosPedidos=0;
      const batch=writeBatch(db);
      const foliosVentaExistentes=new Set(ventas.map(v=>v.folio));
      const foliosGastoExistentes=new Set(gastos.map(g=>g.folio));

      // --- 1) Gastos + abonos de Venta, desde "Registro de Ventas e Ingresos" ---
      const abonosPorFolio={}; // folio -> [{monto,metodo,fecha}]
      if(wsReg){
        const rows=XLSX.utils.sheet_to_json(wsReg,{header:1});
        for(const r of rows.slice(2)){ // salta encabezado + fila de capital inicial
          const [fecha,tipo,folio,conceptoVenta,conceptoPago,comprador,metodo,total]=r;
          if(!tipo) continue;
          if(tipo==="Gasto"){
            if(folio && foliosGastoExistentes.has(folio)) continue; // evita duplicar
            batch.set(doc(collection(db,"gastos")),{folio:folio||null,fecha:fechaCelda(fecha),concepto:conceptoVenta||"Gasto importado",categoria:catInferida(conceptoVenta),metodo:metodo||"Transferencia",monto:+total||0});
            nuevosGastos++;
          } else if(tipo==="Venta" && folio){
            (abonosPorFolio[folio]=abonosPorFolio[folio]||[]).push({monto:+total||0,metodo:metodo||"Transferencia",fecha:fechaCelda(fecha)});
          }
        }
      }
      // --- 2) Pedidos (folio -> cliente/productos/total/detalles) ---
      const conflictos=[]; // folios donde el detalle de abonos no cuadraba con "Abonado a la fecha"
      if(wsPed){
        const rows=XLSX.utils.sheet_to_json(wsPed,{header:1});
        for(const r of rows.slice(1)){
          const [fecha,folio,cliente,productos,metodoGeneral,abonado,totalPedido,faltante,detalles]=r;
          if(!folio) continue;
          if(foliosVentaExistentes.has(folio)) continue; // evita duplicar si ya existe
          const ab=+abonado||0;
          let pagos=abonosPorFolio[folio]||[];
          const sumaLedger=pagos.reduce((s,p)=>s+p.monto,0);
          // Si el detalle de abonos (ledger) no cuadra con el "Abonado a la fecha" de tu hoja Pedidos,
          // confiamos en el resumen (más seguro) y marcamos el folio para que lo revises.
          if(Math.abs(sumaLedger-ab)>0.5){
            conflictos.push(folio);
            pagos = ab>0 ? [{monto:ab,metodo:metodoGeneral||"Transferencia",fecha:fechaCelda(fecha)}] : [];
          }
          batch.set(doc(collection(db,"ventas")),{
            folio, fecha:fechaCelda(fecha), cliente:cliente||"—", productos:productos||"",
            detalles:detalles||"", total:+totalPedido||0, pagos, estadoProd:"activo", referido:null
          });
          nuevosPedidos++;
        }
      }
      if(!nuevosGastos && !nuevosPedidos){ toast("No había nada nuevo que importar (folios ya existentes)"); return; }
      await batch.commit();
      let msg=`Importado: ${nuevosPedidos} pedido(s), ${nuevosGastos} gasto(s) ✨`;
      if(conflictos.length) msg+=` · Revisa abonos de: ${conflictos.join(", ")}`;
      toast(msg);
    }catch(err){ console.error(err); toast("Error leyendo el Excel — revisa el formato"); }
  };
  reader.readAsBinaryString(file);
};

function exportarExcel(){
  const wb=XLSX.utils.book_new();
  // Ventas
  const fv=[["Folio","Fecha","Cliente","Productos","Detalles","Total","Pagado","Falta","Referido"]];
  ventas.forEach(v=>fv.push([v.folio,v.fecha,v.cliente,v.productos,v.detalles,v.total,pagosDe(v),faltanteDe(v),v.referido||""]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(fv),"Ventas");
  // Abonos detallados
  const fa=[["Folio","Cliente","Fecha abono","Método","Monto"]];
  ventas.forEach(v=>(v.pagos||[]).forEach(p=>fa.push([v.folio,v.cliente,p.fecha,p.metodo,p.monto])));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(fa),"Abonos");
  // Gastos
  const fg=[["Folio","Fecha","Concepto","Categoría","Método","Monto"]];
  gastos.forEach(g=>fg.push([g.folio,g.fecha,g.concepto,g.categoria,g.metodo,g.monto]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(fg),"Gastos");
  // Materia prima
  const fm=[["Material","Costo paquete","Rendimiento","Costo unitario","Notas"]];
  materia.forEach(m=>fm.push([m.nombre,m.costoPaquete,m.rendimiento,m.costoUnitario,m.notas]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(fm),"Materia Prima");
  // Resumen
  const cap=capitalActual();
  const fr=[["Concepto","Valor"],["Capital inicial",config.capitalInicial||0],["Ingresos totales",ventas.reduce((s,v)=>s+pagosDe(v),0)],["Gastos totales",gastos.reduce((s,g)=>s+(+g.monto||0),0)],["Capital actual",cap],["Por cobrar",ventas.reduce((s,v)=>s+faltanteDe(v),0)]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(fr),"Resumen");
  XLSX.writeFile(wb,`CreatiBox_Central_${hoy()}.xlsx`);
  toast("Excel descargado 📄");
}

const VISTAS={dashboard:renderDashboard,cotizar:iniciarCoti,pedidos:renderPedidos,ingegr:renderIngEgr,productos:renderProductos,materia:renderMateria};
function irVista(v,_desdeHistorial){
  vistaActual=v;
  Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}}); charts={};
  document.querySelectorAll(".nav-item[data-vista]").forEach(b=>b.classList.toggle("activo",b.dataset.vista===v));
  document.querySelectorAll(".botnav .b[data-vista]").forEach(b=>b.classList.toggle("activo",b.dataset.vista===v));
  const esMas=["productos","materia"].includes(v);
  const btnMas=$("btnMas"); if(btnMas) btnMas.classList.toggle("activo",esMas);
  (VISTAS[v]||renderDashboard)();
  window.scrollTo(0,0);
  // Registrar el cambio de sección como un paso real de navegación,
  // así el botón/gesto de "atrás" del celular regresa aquí en vez de cerrar la app.
  if(!_desdeHistorial){
    if(history.state && history.state.vista===v){ history.replaceState({vista:v},"","#"+v); }
    else history.pushState({vista:v},"","#"+v);
  }
}
window.__irVista=irVista;
document.querySelectorAll("[data-vista]").forEach(b=>b.onclick=()=>irVista(b.dataset.vista));
$("btnMas").onclick=()=>{
  abrirModal(`<button class="modal-close" onclick="__cerrar()">✕</button><h2>Más opciones</h2><div class="msub">Otras secciones de CreatiBox</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
      <button class="menu-item-like btn btn-ghost btn-block" style="justify-content:flex-start" onclick="__irVistaYCerrar('productos')">📦 Productos</button>
      <button class="menu-item-like btn btn-ghost btn-block" style="justify-content:flex-start" onclick="__irVistaYCerrar('materia')">🧵 Materia Prima</button>
      <button class="menu-item-like btn btn-ghost btn-block" style="justify-content:flex-start" onclick="__cerrarYAccion(exportarExcel)">⬇️ Exportar Excel</button>
      <button class="menu-item-like btn btn-ghost btn-block" style="justify-content:flex-start;color:var(--rojo)" onclick="__cerrarYAccion(()=>{if(confirm('¿Cerrar sesión?'))signOut(auth);})">⏻ Salir</button>
    </div>`);
};
window.__cerrarYAccion=(fn)=>{
  cerrarModal(true);
  if(history.state && history.state.modal) history.back(); // limpiamos el paso del modal
  setTimeout(fn,0); // ejecutamos la acción despues del popstate
};
window.__irVistaYCerrar=(v)=>{
  // Cerrar el modal de forma "silenciosa" (sin disparar history.back), y en el mismo
  // history.back consumimos el paso del modal para que quede consistente.
  cerrarModal(true);
  if(history.state && history.state.modal){
    // Reemplazamos el estado del modal por la nueva vista, evitando la carrera con popstate.
    history.replaceState({vista:v},"","#"+v);
    irVista(v,true);
  } else {
    irVista(v);
  }
};
$("btnExcel").onclick=exportarExcel;
$("btnSalir").onclick=()=>{ if(confirm("¿Cerrar sesión?")) signOut(auth); };

/* Sincronización en tiempo real */
let subs=[];
function escuchar(){
  subs.forEach(u=>u()); subs=[];
  const wire=(col,setter)=>subs.push(onSnapshot(collection(db,col),s=>{setter(s.docs.map(d=>({id:d.id,...d.data()}))); if(!$("app").classList.contains("oculto")) VISTAS[vistaActual]?.();},e=>{console.error(col,e);toast("Error: "+(e.code||e.message));}));
  wire("ventas",d=>ventas=d);
  wire("gastos",d=>gastos=d);
  wire("materiaPrima",d=>materia=d);
  wire("productosCustom",d=>productosCustom=d);
  subs.push(onSnapshot(doc(db,"config","general"),s=>{if(s.exists())config=s.data(); if(vistaActual==="dashboard"&&!$("app").classList.contains("oculto"))renderDashboard();}));
  subs.push(onSnapshot(doc(db,"config","precios"),s=>{ preciosOverride = s.exists()?s.data():{}; if(!$("app").classList.contains("oculto")&&(vistaActual==="productos"||vistaActual==="cotizar")) VISTAS[vistaActual]?.(); }));
}

onAuthStateChanged(auth,async user=>{
  $("cargando").classList.add("oculto");
  if(user){
    $("vLogin").classList.add("oculto"); $("app").classList.remove("oculto"); $("botnav").classList.remove("oculto");
    escuchar();
    await sembrarSiVacio();
    // "dashboard" es la raíz de la navegación: reemplaza (no apila) para que el
    // primer toque de "atrás" desde aquí sí pueda salir de la app, como es normal.
    history.replaceState({vista:"dashboard"},"","#dashboard");
    irVista("dashboard",true);
  } else {
    $("vLogin").classList.remove("oculto"); $("app").classList.add("oculto"); $("botnav").classList.add("oculto");
  }
});
$("btnLogin").onclick=async()=>{ $("loginErr").textContent=""; try{ await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPass").value); }catch(e){ $("loginErr").textContent="Correo o contraseña incorrectos."; } };
$("loginPass").addEventListener("keydown",e=>{ if(e.key==="Enter")$("btnLogin").click(); });

/* Botón/gesto de "atrás" del celular: primero cierra modales, luego navega entre secciones,
   y solo sale de la app cuando ya no hay nada más atrás (como cualquier app real). */
window.addEventListener("popstate",(e)=>{
  if($("modal").classList.contains("abierto")){
    cerrarModal(true); // ya lo cerró el navegador al retroceder, no volvemos a hacer history.back()
    return;
  }
  const v=(e.state&&e.state.vista)||"dashboard";
  if($("app") && !$("app").classList.contains("oculto")) irVista(v,true);
});
window.addEventListener("unhandledrejection",e=>{ console.error("PROMESA",e.reason); });
